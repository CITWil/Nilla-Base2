name: Nilla OS # Replace this name with your image name
id: nilla-os # Replace this ID with your image ID
vibversion: 1.1.0

stages:
- id: build
  base: ghcr.io/vanilla-os/gnome:latest # Optionally, Replace this image URL with a different one i.e. gnome-nvidia:latest, etc
  addincludes: true
  singlelayer: false
  labels:
    maintainer: self-maintained # Optionally, Replace this with your name
  args:
    DEBIAN_FRONTEND: noninteractive # Set the image environment as non-interactive
  cleanup:
    - /tmp/*
    - /var/tmp/*

  # Commands to run first before building the modules
  runs:
    commands:
      - echo 'APT::Install-Recommends "1";' > /etc/apt/apt.conf.d/01norecommends

  modules:
  - name: init-setup
    type: shell
    commands:
    - lpkg --unlock
    - apt-get update


  # Put your custom actions below this comment
  - name: networking
    type: apt
    sources:
      - packages:
        - wireguard-tools
        - openvpn3-client
        - network-manager-openvpn
  
  - name: backup
    type: apt
    sources:
      - packages:
        - restic
        - rclone
        - rclone-browser
        - keepassxc-full
  
  - name: terminal-tools
    type: apt
    sources:
      - packages:
        - fastfetch
        - wl-clipboard
        - gpg
        - qalculate-gtk
        - git
        - robotfindskitten

  - name: diagnostics
    type: apt
    sources:
      - packages:
        - wireshark
        - wavemon
        - iotop
        - powertop
        - ipcalc
        - iperf3
  
  - name: cosmic-repo
    type: shell
    commands:
        - mkdir -p /etc/apt/keyrings
        - curl -fsSL https://lcheylus.github.io/cosmic-debian/gpg.key -o
          /etc/apt/keyrings/cosmic-debian-keyring.asc
        - echo "deb [arch=amd64
          signed-by=/etc/apt/keyrings/cosmic-debian-keyring.asc]
          https://lcheylus.github.io/cosmic-debian/ forky main" >
          /etc/apt/sources.list.d/cosmic-debian.list
        - apt-get update
  
  - name: cosmic
    type: apt
    sources:
      - packages:
        - cosmic-session
        - cosmic-files
        - cosmic-term
        - cosmic-store
        - gnome-keyring
 
  - name: connectivity
    type: apt
    sources:
      - packages:
        - nautilus-kdeconnect
        - nautilus-nextcloud
        - kdeconnect
  
  - name: zen
    type: shell
    sources:
      - type: file
        url: https://github.com/zen-browser/desktop/releases/download/1.24.3b/zen-x86_64.AppImage
    commands:
      - mkdir /appimages/
      - mv /sources/zen/zen-x86_64.AppImage /appimages/zen-x86_64.AppImage
  
  - name: beeper
    type: shell
    sources:
      - type: file
        url: https://api.beeper.com/desktop/download/linux/x64/stable/com.automattic.beeper.desktop
    commands:
      - mv /sources/beeper/* /appimages/
  
  - name: install-flatpak-apps
    type: flatpak
    system:
      repo-url: https://flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub
      install:
      - it.mijorus.gearlever
      - dev.zed.Zed-Preview
      - org.chromium.Chromium
      remove: []

  - name: example-packages # Sample module using the built-in Apt module to install packages
    type: apt
    sources:
      - packages:
        - vim

  - name: example-commands # Sample module demonstrating the Shell module with custom commands
    type: shell
    commands:
    - echo Example output
    #- curl -fsSL https://github.com/zen-browser/updates-server/raw/refs/heads/main/install.sh | $SHELL

  - name: example-modules # Sample module demonstrating importing local and remote modules
    type: includes
    includes:
      - modules/50-install-debs.yml # Sample local module present in this repository
      # - gh:vanilla-os/dev-image:main:modules/00-basics.yml # Sample GitHub remote module in the format: `gh:your-name/your-repo:branch:modules/file.yml`
      # - https://raw.githubusercontent.com/Vanilla-OS/dev-image/main/modules/05-go.yml # Sample full URL remote module

  # Put your custom actions above this comment

  - name: set-image-name-abroot
    type: includes
    includes:
      - modules/80-set-image-abroot-config.yml

  - name: cleanup
    type: shell
    commands:
    - apt-get autoremove -y
    - apt-get clean
    - lpkg --lock
